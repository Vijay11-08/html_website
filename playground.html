<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live HTML5 Playground & Sandbox - Real-Time Code Editor | HTMLVerse</title>
  <meta name="description" content="Test, edit, and experiment with HTML code in real time. Features responsive device viewports, template presets, instant preview, and file download.">
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="fs-4">🚀</span>
        <span class="brand-gradient fs-4">HTMLVerse</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="index.html"><i class="bi bi-house me-1"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="tags.html"><i class="bi bi-tags me-1"></i> Tag Encyclopedia</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="tutorial.html"><i class="bi bi-book me-1"></i> Tutorials</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-semibold" href="playground.html"><i class="bi bi-play-circle me-1"></i> Live Playground</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="cheatsheet.html"><i class="bi bi-card-checklist me-1"></i> Cheat Sheet</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="quiz.html"><i class="bi bi-patch-question me-1"></i> Quiz</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-secondary border-0" id="theme-toggle-btn" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
            <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
          </button>
          <a href="tags.html" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-search me-1"></i> Browse Tags
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Playground Controls Bar -->
  <div class="bg-body-tertiary border-bottom py-2">
    <div class="container-fluid px-lg-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <!-- Preset Selector -->
        <div class="d-flex align-items-center gap-2">
          <label for="preset-select" class="small fw-bold text-secondary text-nowrap">
            <i class="bi bi-magic me-1"></i> Templates:
          </label>
          <select id="preset-select" class="form-select form-select-sm" style="width: 220px;">
            <option value="starter">HTML5 Starter Boilerplate</option>
            <option value="semantics">Semantic Blog Layout</option>
            <option value="form">Accessible Contact Form</option>
            <option value="dialog">HTML5 &lt;dialog&gt; Modal</option>
            <option value="table">Data Table Architecture</option>
            <option value="media">HTML5 Video & Audio</option>
          </select>
        </div>

        <!-- Viewport Switcher -->
        <div class="d-flex align-items-center gap-1 bg-body p-1 rounded border shadow-sm">
          <span class="small text-secondary px-2 d-none d-sm-inline">Preview:</span>
          <button class="btn btn-sm btn-outline-secondary active" data-viewport="desktop" title="Desktop View (100%)">
            <i class="bi bi-display"></i> <span class="d-none d-md-inline">Desktop</span>
          </button>
          <button class="btn btn-sm btn-outline-secondary" data-viewport="tablet" title="Tablet View (768px)">
            <i class="bi bi-tablet"></i> <span class="d-none d-md-inline">Tablet</span>
          </button>
          <button class="btn btn-sm btn-outline-secondary" data-viewport="mobile" title="Mobile View (375px)">
            <i class="bi bi-phone"></i> <span class="d-none d-md-inline">Mobile</span>
          </button>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary" id="copy-editor-btn" title="Copy code to clipboard">
            <i class="bi bi-clipboard me-1"></i> Copy
          </button>
          <button class="btn btn-sm btn-outline-primary" id="download-code-btn" title="Download HTML file">
            <i class="bi bi-download me-1"></i> Download
          </button>
          <button class="btn btn-sm btn-outline-danger" id="clear-editor-btn" title="Clear editor">
            <i class="bi bi-trash3"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Split Screen Editor & Live Preview -->
  <main class="flex-grow-1 py-3">
    <div class="container-fluid px-lg-4 h-100">
      <div class="row g-3 h-100">
        <!-- Left: Code Editor -->
        <div class="col-lg-6">
          <div class="playground-editor-wrapper d-flex flex-column h-100">
            <div class="bg-dark text-white px-3 py-2 d-flex justify-content-between align-items-center border-bottom border-secondary">
              <span class="small font-monospace text-warning">
                <i class="bi bi-code-slash me-1"></i> HTML Editor
              </span>
              <span class="badge bg-secondary font-monospace small">Live Sync</span>
            </div>
            <textarea id="code-editor" class="code-textarea flex-grow-1" placeholder="Type or paste your HTML code here..." spellcheck="false"></textarea>
          </div>
        </div>

        <!-- Right: Live Sandboxed Output -->
        <div class="col-lg-6">
          <div class="preview-container d-flex flex-column h-100 shadow-sm">
            <div class="bg-dark text-white px-3 py-2 d-flex justify-content-between align-items-center border-bottom border-secondary">
              <span class="small font-monospace text-info">
                <i class="bi bi-window me-1"></i> Sandboxed Output
              </span>
              <span class="badge bg-success font-monospace small">Responsive Viewport</span>
            </div>
            <div id="preview-viewport-wrapper" class="device-preview-wrapper device-desktop flex-grow-1 bg-white">
              <iframe id="preview-frame" class="preview-frame" sandbox="allow-scripts allow-modals allow-forms allow-same-origin" title="Live Preview Frame"></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Help & Shortcuts Footer -->
  <div class="bg-body-tertiary border-top py-2 text-center small text-secondary">
    <div class="container">
      <span><i class="bi bi-info-circle me-1"></i> Press <kbd>Tab</kbd> inside editor to indent two spaces. Changes recompile immediately into the live sandboxed frame.</span>
    </div>
  </div>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data & Controller Scripts -->
  <script src="js/tags-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/playground.js"></script>
</body>
</html>
